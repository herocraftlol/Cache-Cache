name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.1)'
        required: true
        default: '1.0.1'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Build with Maven
        run: mvn clean package -DskipTests
        
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: CacheCache-${{ inputs.version }}
          path: target/CacheCache.jar
          
      - name: Create Source ZIP
        run: |
          zip -r source.zip src/ pom.xml README.md
          
      - name: Upload Source ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: CacheCache-${{ inputs.version }}-source
          path: source.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      jar_path: ${{ steps.download_artifact.outputs.jar_path }}
      source_path: ${{ steps.download_artifact.outputs.source_path }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Download JAR artifact
        id: download_jar
        uses: actions/download-artifact@v4
        with:
          name: CacheCache-${{ inputs.version }}
          path: ./build
          
      - name: Download Source ZIP artifact
        id: download_source
        uses: actions/download-artifact@v4
        with:
          name: CacheCache-${{ inputs.version }}-source
          path: ./build
          
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          release_name: CacheCache v${{ inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./build/CacheCache.jar
            ./build/source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
