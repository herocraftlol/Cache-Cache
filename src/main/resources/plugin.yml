name: CacheCache
version: 1.4.0
main: com.hideseek.cachecache.CacheCachePlugin
api-version: '1.21'
authors: [herocraftlol]
description: Plugin de mini-jeu Cache-Cache (Hide & Seek / Prop Hunt style) pour serveur Minecraft Paper 1.21. Les joueurs cachés se camouflent en mobs et le Seeker doit les retrouver!
softdepend: [ProtocolLib]

commands:
  cc:
    description: Commande principale du plugin Cache-Cache
    usage: /cc help

permissions:
  cachecache.admin:
    description: Autorise à casser/poser des blocs sur les maps même pendant une partie en cours
    default: op
